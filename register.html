<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - CodePedia</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body style="background: linear-gradient(135deg, #2563eb, #1e40af);">
    <div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div class="card" style="max-width: 420px; width: 100%; padding: 40px 32px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <a href="/" style="font-size: 28px; font-weight: 700; color: var(--primary); text-decoration: none;">
                    Code<span style="color: var(--text);">Pedia</span>
                </a>
                <h2 style="margin-top: 16px; font-size: 24px;">Mulai Belajar</h2>
                <p class="text-muted" style="font-size: 14px;">Daftar gratis sekarang</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" placeholder="Nama kamu" required />
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="email@example.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6" />
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Daftar</button>
            </form>

            <div id="registerMessage" style="margin-top: 16px; text-align: center; font-size: 14px;"></div>

            <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-light);">
                Sudah punya akun? <a href="/login.html">Masuk</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('registerMessage');

            const result = await registerUser(name, email, password);
            
            if (result.success) {
                message.innerHTML = `<span style="color: #16a34a;">✅ ${result.message}</span>`;
                setTimeout(() => window.location.href = '/login.html', 2000);
            } else {
                message.innerHTML = `<span style="color: #dc2626;">❌ ${result.message}</span>`;
            }
        });
    </script>
</body>
</html>
